services:
  app:
    build: .
    image: electronic-components
    pull_policy: never
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media/:/app/media/
      - ./staticfiles/:/app/staticfiles/
    # gunicorn listens only after migrate and collectstatic (entrypoint.sh)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8012:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./staticfiles/:/srv/staticfiles/:ro
      - ./media/:/srv/media/:ro
      - caddy_data:/data

volumes:
  caddy_data:
