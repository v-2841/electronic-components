[project]
name = "electronic-components"
version = "0.1.0"
description = "Учёт радиодеталей: сайт и API"
authors = [
    {name = "Vitaliy Pavlov",email = "v-2841@yandex.ru"}
]
license = "LICENSE"
requires-python = ">=3.15,<4"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-filter (>=26.2,<27.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "gunicorn (>=27.0.1,<28.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "flake8 (>=7.5.0,<8.0.0)",
    "djlint (>=1.54.0,<2.0.0)"
]

[tool.djlint]
profile = "django"
